spring.application.name=dyplom

# Налаштування підключення до бази даних (тут вкажи назву твоєї бази, логін та пароль)
spring.datasource.url=jdbc:mysql://localhost:3306/dyplom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=твоє_пароль_до_бд

# Налаштування Hibernate / JPA (автоматичне створення таблиць для диплома — це дуже зручно)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect